{% extends "base.html" %}

{% block title %}{{ title }} · AI Quiz Generator{% endblock %}

{% block content %}
<div class="max-w-xl w-full mx-auto p-6">
  <div class="rounded-3xl bg-white p-8 border-2 border-black space-y-4 text-center">
    <p class="text-5xl font-black text-zinc-900">{{ status_code }}</p>
    <h1 class="text-2xl font-semibold text-zinc-900">{{ title }}</h1>
    <p class="text-zinc-600">{{ message }}</p>
    <a
      href="/"
      class="inline-block px-4 py-2 rounded-lg text-black bg-white hover:bg-zinc-900 hover:text-white border-2 border-black font-semibold transition"
    >
      Back to quiz generator
    </a>
  </div>
</div>
{% endblock %}
