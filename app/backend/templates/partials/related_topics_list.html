{% if related_topics %}
  <div class="related-topics space-y-2 border-t pt-2">
    <h3 class="text-lg font-semibold">Related Topics</h3>
    <ul class="flex flex-row flex-wrap gap-x-3 gap-y-1.5">
      {% for topic in related_topics %}
        <li>
          <button
            type="button"
            class="text-gray-600 font-semibold rounded-full text-sm hover:text-blue-500 cursor-pointer"
            data-topic="{{ topic }}"
          >{{ topic }}</button>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
