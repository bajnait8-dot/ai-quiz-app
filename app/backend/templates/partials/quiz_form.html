<form
  id="generate-form"
  hx-post="/generate-quiz"
  hx-target="#stage"
  hx-swap="innerHTML"
  hx-disabled-elt="find button[type='submit']"
  class="mx-auto w-full space-y-4 rounded-2xl border-2 border-black bg-white p-4 sm:rounded-3xl sm:p-5"
  aria-label="Generate a quiz"
>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <input type="hidden" name="current_quiz_id" id="current-quiz-id" value="{{ initial_quiz.quiz_id if initial_quiz else '' }}" />

  <h2 class="text-center text-xl font-semibold text-zinc-900 sm:text-2xl">Generate Quiz</h2>

  <label class="topic-field block">
    <span class="text-sm font-medium text-gray-700">Topic</span>
    <input
      id="topic-input"
      type="text"
      name="topic"
      value="{{ form.topic }}"
      placeholder="Eg: Python FastApi Framework"
      minlength="{{ topic_min }}"
      maxlength="{{ topic_max }}"
      autocomplete="off"
      required
      aria-describedby="form-error"
      class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base focus:border-blue-400 focus:ring-2 focus:ring-blue-400"
    />
    <p id="form-error" class="mt-1 ml-1 text-sm text-red-500" aria-live="polite">{{ error }}</p>
  </label>

  <fieldset class="block">
    <legend class="text-sm font-medium text-gray-700">Intensity</legend>
    <div class="mt-1 grid grid-cols-3 gap-2">
      {% for value, label in [('easy', 'Easy'), ('medium', 'Medium'), ('hard', 'Hard')] %}
        <label
          for="intensity-{{ value }}"
          class="intensity-option flex cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-2 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:border-gray-400"
        >
          <input
            id="intensity-{{ value }}"
            name="intensity"
            type="radio"
            value="{{ value }}"
            {% if form.intensity == value %}checked{% endif %}
            class="h-4 w-4 shrink-0 accent-zinc-900"
          />
          <span>{{ label }}</span>
        </label>
      {% endfor %}
    </div>
  </fieldset>

  <label class="block">
    <span class="text-sm font-medium text-gray-700">Number of Questions (Max: {{ quiz_max }})</span>
    <input
      type="number"
      name="length"
      min="{{ quiz_min }}"
      max="{{ quiz_max }}"
      value="{{ form.length }}"
      required
      class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2.5 text-base focus:border-blue-400 focus:ring-2 focus:ring-blue-400"
    />
  </label>

  <button
    type="submit"
    class="w-full rounded-lg border-2 border-black bg-white px-4 py-2.5 font-semibold text-black transition-colors hover:bg-zinc-900 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"
  >
    Generate Quiz
  </button>

  <p class="text-xs leading-relaxed text-gray-500">
    Note: Quiz generation may take up to 30 seconds.
  </p>

  {% include "partials/related_topics.html" %}
</form>
